[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "college"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["flask==3.1.3"]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "pyright"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--cov=college --cov-branch --cov-fail-under=100 --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["college"]
omit = ["tests/*"]

[tool.ruff]
src = ["src/college"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pyright]
include = ["src/college"]
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
