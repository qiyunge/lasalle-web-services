[project]
name = "lab-intelligence"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Grant Ge", email = "grantnj.ge@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "httpx>=0.28.1",
    "openai>=3.51.0",
    "orvexa-agent-harness",
]

[project.scripts]
lab-intelligence = "lab_intelligence:main"
serve = "lab_intelligence.main:serve"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: tests requiring external services",]
addopts = "-m 'not integration'"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E","F","I","B","UP"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["src", "tests"]

[tool.uv.sources]
orvexa-agent-harness = { path = "../../orvexa-agent-harness", editable = true }
